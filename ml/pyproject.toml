[project]
name = "scamshield-ml"
version = "0.1.0"
description = "ScamShield's offline dataset and training pipeline (not part of the Gradle build)."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "tokenizers>=0.19",
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "sentencepiece>=0.2",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
